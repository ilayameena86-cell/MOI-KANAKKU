name: APK உருவாக்கு

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: moi-kanakku-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Copy Excel library into the app
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: moi-kanakku-app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moi-kanakku-apk
          path: moi-kanakku-app/android/app/build/outputs/apk/debug/app-debug.apk
